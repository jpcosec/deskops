  node_role: delivery
  parent_id: PK0
  owner_repo: deskops
  estimate: S
  depends_on: [B01]
  requires: []
  scope: 'pre-commit como dependencia del extra dev de pyproject.toml; .pre-commit-config.yaml con los hooks ruff (check)
      y ruff-format de astral-sh/ruff-pre-commit, limitados con files: ^(deskops|tests)/; y en .github/workflows/tests.yml,
