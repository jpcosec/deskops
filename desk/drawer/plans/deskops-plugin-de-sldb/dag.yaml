      una rama de prueba con un error de ruff hace fallar el paso de ruff del CI.
  output_scope: pyproject.toml, .pre-commit-config.yaml, .github/workflows/tests.yml
- id: B04
  title: CI en verde
  kind: code
  node_role: delivery
  parent_id: PK0
  owner_repo: deskops
  estimate: S
  depends_on: []
  requires: []
  scope: 'Dos fallas del run 45486095078 de GitHub: (a) el golden help/deskops_add_atom.txt difiere entre 3.12 y 3.13; se
      normaliza la diferencia de formato de argparse en tests/test_output_goldens.py o en el texto de ayuda, para que ambas
      versiones den el mismo golden. (b) sldb stores build --check --store .sldb falla con rules/builtin:tag_namespace:domain
      diciendo que falta el ancla de domain:knowledge-management, aunque el ancla existe: desk/atoms/crossroad-knowledge-management.md
      es un CrossroadDoc trackeado con path knowledge-management y la declaración de domain en .sldb/store.yaml es anchored_by
      CrossroadDoc.path con value bare. B04 diagnostica por qué la regla no la ve y lo arregla en deskops; si la causa está
      en sldb, la deja como nota en el inbox de sldb y en deskops aplica solo lo mínimo para que el check pase, con el motivo
      escrito. El tiempo del CI es de B05.'
  acceptance: tests/test_output_goldens.py pasa con Python 3.12 y con 3.13; sldb stores build --check --store .sldb sale
      con 0; el commit explica la causa de (b).
  output_scope: tests/test_output_goldens.py, tests/fixtures/golden/help/, .sldb/, desk/atoms/
- id: B05
  title: CI en menos de 20 minutos
  kind: code
  node_role: delivery
  parent_id: PK0
  owner_repo: deskops
  estimate: M
  depends_on: [B04]
  requires: []
  scope: 'pytest-xdist en el install del CI con -n 2 por job; concurrency con cancel-in-progress en el workflow; y la RAM
      de la suite: un hook de tests/conftest.py registra el pico de RSS de cada test (resource.getrusage, ru_maxrss) y escribe
      los 10 mayores al final, y se bajan los tests o fixtures de ese top que cargan stores enteros o no liberan recursos.
      Al cerrar, la tarea task-la-suite-de-deskops-baja-su-ram-por-worker-y-declara-en-que-maquina-y-con-cuantos-workers-corre
      se cierra como resuelta por B05.'
  acceptance: En una corrida del workflow tests sobre main, cada job de la matriz (3.12 y 3.13) termina en success en menos
      de 20 minutos. En local, python -m pytest -q -n 4 tests no supera 3 GB de RSS sumado entre workers (medido con el hook),
      y AGENTS.md dice con cuántos workers y en qué máquina se corre la suite completa.
  output_scope: .github/workflows/tests.yml, pyproject.toml, tests/conftest.py, AGENTS.md
- id: B06
